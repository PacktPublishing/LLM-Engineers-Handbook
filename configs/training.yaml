settings:
  docker:
    parent_image: 992382797823.dkr.ecr.eu-central-1.amazonaws.com/zenml-rlwlcs:latest
    skip_build: True
  orchestrator.sagemaker:
    synchronous: false

parameters:
  finetuning_type: dpo # 'sft' = instruction tuning; 'dpo' = preference tuning on top of the SFT model.
  num_train_epochs: 3
  per_device_train_batch_size: 2
  learning_rate: 3e-4
  dataset_huggingface_workspace: mryoussef79
  is_dummy: false # Set to 'true' for a quick, cheap smoke test (400 samples, 1 epoch).
